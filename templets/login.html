{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block body %}
<br><br><br>
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="glass hero-card">
      <span class="hero-badge">🔐 Login</span>
      <h1 class="section-title h2">Sign in to continue</h1>
      <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          {{ login_form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          {{ login_form.password }}
        </div>
        <button type="submit" class="btn btn-primary-glow w-100">Login</button>
      </form>
    </div>
  </div>
</div>
<br><br><br><br><br><br>
<br><br><br>
{% endblock %}
